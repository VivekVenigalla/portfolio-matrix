<title>Target-Driven Portfolio Matrix</title>

<style>
html { background: #0A0A0A; }
body { margin: 0; }
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.offline { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #8793A0; font: 15px/1.5 system-ui, sans-serif; }
/* Layout: one-screen app. A full-bleed canvas is the stage (the DAG lives there);
   every other surface is a glass panel floating over it: top bar, node index rail,
   status bar, quest panel, and the target terminal that opens the session. */
:root {
  color-scheme: dark;
  --void: #0A0A0A;
  --ink: #E7EEF4;
  --muted: #8793A0;
  --faint: #5B6672;
  --slate: #3A424C;
  --cyan: #22E5FF;
  --green: #8CFF3F;
  --gold: #FFC83D;
  --red: #FF6B78;
  --glass: rgba(15, 19, 23, .62);
  --glass-hi: rgba(255, 255, 255, .04);
  --line: rgba(190, 220, 255, .10);
  --line-2: rgba(190, 220, 255, .2);
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --sans: 'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .85, .2, 1);
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { position: relative; height: 100%; overflow: hidden; overflow: clip; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }

.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.glass {
  background: linear-gradient(180deg, var(--glass-hi), transparent 40%), var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 24px 60px rgba(0, 0, 0, .55);
}
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  padding: 0 12px; height: 32px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  background: rgba(255, 255, 255, .04); border: 1px solid var(--line-2); color: var(--ink);
  transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn:focus-visible, .row:focus-visible, .chip:focus-visible, .field input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line-2); color: var(--ink); }
.btn.primary { background: var(--cyan); border-color: var(--cyan); color: #00161B; font-weight: 700; box-shadow: 0 0 24px rgba(34, 229, 255, .28); }
.btn.primary:hover { color: #00161B; box-shadow: 0 0 34px rgba(34, 229, 255, .5); }
.btn.icon { width: 32px; padding: 0; }
.btn.tall { height: 40px; }

/* ---------- HUD (hidden until the matrix is compiled) ---------- */
.hud { transition: opacity .6s var(--ease), transform .6s var(--ease); }
[data-phase="input"] .hud, [data-phase="generating"] .hud { opacity: 0; pointer-events: none; }
[data-phase="input"] .topbar, [data-phase="generating"] .topbar { transform: translateY(-12px); }
[data-phase="input"] .statusbar, [data-phase="generating"] .statusbar { transform: translateY(12px); }
[data-phase="input"] .rail, [data-phase="generating"] .rail { transform: translateX(-12px); }

.topbar { position: absolute; top: 12px; left: var(--gl); right: var(--gr); height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 8px 0 14px; z-index: 3; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .2em; }
.brand svg { color: var(--cyan); filter: drop-shadow(0 0 6px rgba(34, 229, 255, .7)); }
.sep { width: 1px; height: 18px; background: var(--line-2); flex: none; }
.target { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 10px; }
.target b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.progress { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.segs { display: flex; gap: 3px; }
.segs i { width: 14px; height: 6px; border-radius: 1px; background: var(--slate); transition: background .5s, box-shadow .5s; }
.segs i[data-s="active"] { background: var(--cyan); box-shadow: 0 0 8px rgba(34, 229, 255, .7); }
.segs i[data-s="verified"] { background: var(--green); box-shadow: 0 0 8px rgba(140, 255, 63, .55); }
.segs i[data-s="verified"][data-boss="true"] { background: var(--gold); box-shadow: 0 0 8px rgba(255, 200, 61, .6); }
.progress em { font-style: normal; color: var(--ink); }

.rail { position: absolute; top: 70px; left: var(--gl); width: 236px; z-index: 2; padding: 12px 6px 6px; display: none; }
.rail .eyebrow { padding: 0 8px 8px; display: flex; justify-content: space-between; }
.row { width: 100%; display: grid; grid-template-columns: 10px 30px 1fr auto; align-items: center; gap: 8px; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; transition: background .12s, opacity .15s; }
.row:hover, .row[data-hot="true"] { background: rgba(255, 255, 255, .06); }
.row[data-sel="true"] { background: rgba(34, 229, 255, .09); box-shadow: inset 2px 0 0 var(--cyan); }
.row[data-dim="true"] { opacity: .35; }
.row .code { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.row .name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .tier { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.row[data-s="locked"] .name { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--slate); flex: none; }
.dot[data-s="active"] { border-color: var(--cyan); background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: breathe 1.8s ease-in-out infinite; }
.dot[data-s="verified"] { border-color: var(--green); background: var(--green); box-shadow: 0 0 8px rgba(140, 255, 63, .6); }
.dot[data-s="verified"][data-boss="true"] { border-color: var(--gold); background: var(--gold); box-shadow: 0 0 8px rgba(255, 200, 61, .6); }
@keyframes breathe { 50% { box-shadow: 0 0 3px var(--cyan); opacity: .7; } }

.statusbar { position: absolute; bottom: 12px; left: var(--gl); right: var(--gr); height: 46px; display: flex; align-items: center; gap: 16px; padding: 0 8px 0 14px; z-index: 3; }
.legend { display: flex; gap: 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.readout { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.readout b { color: var(--ink); font-weight: 500; }
.readout .up { color: #fff; } .readout .down { color: var(--cyan); }
.readout .phone { display: none; }
.tools { display: flex; gap: 6px; }

/* ---------- Target terminal (state 0) ---------- */
.termwrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px var(--gr) 16px var(--gl); z-index: 5; transition: opacity .5s var(--ease), transform .5s var(--ease), visibility 0s; }
[data-phase="matrix"] .termwrap { opacity: 0; transform: scale(.96); pointer-events: none; visibility: hidden; transition: opacity .5s var(--ease), transform .5s var(--ease), visibility 0s .5s; }
.term { width: min(660px, 100%); padding: 0; overflow: hidden; }
.term-head { display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.term-body { padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 20px; }
.term h1 { font-weight: 300; font-size: clamp(24px, 4.6vw, 34px); line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.term h1 span { color: var(--cyan); }
.term .lede { color: var(--muted); max-width: 52ch; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 52px; border: 1px solid var(--line-2); border-radius: 8px; background: rgba(0, 0, 0, .45); transition: border-color .15s, box-shadow .15s; }
.field:focus-within { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 229, 255, .12), 0 0 30px rgba(34, 229, 255, .12); }
.field .prompt { font-family: var(--mono); color: var(--cyan); font-weight: 700; }
.field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-family: var(--mono); font-size: 14px; caret-color: var(--cyan); }
.field input:focus-visible { outline: 0; }
.field input::placeholder { color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--muted); cursor: pointer; transition: color .15s, border-color .15s; }
button.chip:hover { color: var(--cyan); border-color: var(--cyan); }
.chip[data-s="active"] { color: var(--cyan); border-color: rgba(34, 229, 255, .4); }
.chip[data-s="verified"] { color: var(--green); border-color: rgba(140, 255, 63, .35); }
.chip[data-s="verified"][data-boss="true"] { color: var(--gold); border-color: rgba(255, 200, 61, .4); }
.term-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.note { font-size: 12.5px; color: var(--faint); max-width: 44ch; }
.err { font-family: var(--mono); font-size: 11.5px; color: var(--red); }
.log { font-family: var(--mono); font-size: 12.5px; display: flex; flex-direction: column; gap: 9px; min-height: 150px; }
.log div { display: grid; grid-template-columns: 16px 76px 1fr; gap: 8px; animation: rise .25s var(--ease) both; }
.log .ok { color: var(--green); } .log .k { color: var(--faint); } .log .v { color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.log .run { color: var(--cyan); animation: blink .7s steps(2) infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- Quest panel (states 2 and 3) ---------- */
.panel { position: absolute; top: 70px; bottom: 70px; right: var(--gr); width: min(424px, calc(100% - var(--gl) - var(--gr))); z-index: 4; display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 40px)); opacity: 0; visibility: hidden; transition: transform .5s var(--ease), opacity .3s, visibility 0s .5s; }
.panel[data-open="true"] { transform: none; opacity: 1; visibility: visible; transition: transform .5s var(--ease), opacity .3s, visibility 0s; }
.panel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--slate); transition: background .5s, box-shadow .5s; }
.panel[data-status="active"]::before { background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
.panel[data-status="verified"]::before { background: var(--green); box-shadow: 0 0 18px var(--green); }
.panel[data-status="verified"][data-boss="true"]::before { background: var(--gold); box-shadow: 0 0 18px var(--gold); }
.qp-head { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.qp-top { display: flex; align-items: center; gap: 10px; }
.qp-top .code { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; flex: 1; }
.pill { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--slate); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.pill[data-s="active"] { border-color: rgba(34, 229, 255, .5); color: var(--cyan); background: rgba(34, 229, 255, .08); }
.pill[data-s="verified"] { border-color: rgba(140, 255, 63, .5); color: var(--green); background: rgba(140, 255, 63, .08); }
.pill[data-s="verified"][data-boss="true"] { border-color: rgba(255, 200, 61, .5); color: var(--gold); background: rgba(255, 200, 61, .08); }
.qp-head h2 { font-weight: 500; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.qp-head p { color: var(--muted); font-size: 14px; }
.qp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 20px; }
.qp-body > * { flex: none; }
.quest { display: flex; flex-direction: column; gap: 10px; }
.quest h3 { font-weight: 500; font-size: 18px; line-height: 1.25; text-wrap: balance; }
.quest p { color: #C5CFD8; max-width: 60ch; }
.boss-tag { color: var(--gold); }
.meta { display: grid; grid-template-columns: auto auto 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.meta div { background: rgba(10, 12, 14, .7); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.meta b { font-family: var(--mono); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.meta .art { font-family: var(--sans); font-size: 13px; font-weight: 400; }
.accept { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
.accept li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 14px; color: #C5CFD8; }
.box { width: 16px; height: 16px; margin-top: 3px; border: 1px solid var(--line-2); border-radius: 3px; display: grid; place-items: center; color: transparent; transition: all .2s; }
.accept li[data-ok="true"] .box { border-color: var(--green); background: rgba(140, 255, 63, .14); color: var(--green); }
.lineage { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
.redact { filter: blur(6px); opacity: .55; user-select: none; pointer-events: none; }
.qp-foot { border-top: 1px solid var(--line); padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; background: rgba(0, 0, 0, .28); }
.qp-foot .field { height: 44px; }
.qp-foot .field input { font-size: 12.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1; }
.vlog { font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 7px; }
.vlog div { display: grid; grid-template-columns: 16px 52px 1fr; gap: 8px; animation: rise .2s var(--ease) both; }
.vlog .k { color: var(--faint); } .vlog .v { overflow-wrap: anywhere; min-width: 0; }
.proof { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-family: var(--mono); font-size: 12px; }
.proof dt { color: var(--faint); } .proof dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.lockmsg { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.lockmsg svg { flex: none; margin-top: 3px; }

@media (min-width: 1280px) { .rail { display: block; } }
@media (max-width: 719px) {
  .progress .segs, .progress .xp, .progress .word, .wordmark, .target .eyebrow, .btn .label, .legend, .readout .desk { display: none; }
  .readout { text-align: left; font-size: 10px; }
  .readout .phone { display: inline; }
  .btn.haslabel { width: 32px; padding: 0; }
  .panel { top: auto; left: var(--gl); right: var(--gr); bottom: 0; width: auto; height: 74%; border-bottom-left-radius: 0; border-bottom-right-radius: 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .term-body { padding: 20px 16px 18px; }
}
.legend em { font-style: normal; }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition-duration: .01s !important; }
}
</style>
</head>

        tick >= 1 ? line('c', 'check', 'acceptance criteria ' + Math.min(n, Math.max(0, tick - 1)) + '/' + n, tick >= n + 1) : null,
        tick >= n + 1 ? line('h', 'hash', 'artifact ' + fakeHash(node.id + runUrl.current), tick >= n + 2) : null,
        tick >= n + 2 ? line('s', 'sign', 'proof-of-work record', tick >= n + 3) : null));
  } else {
    foot = h('form', { className: 'qp-foot', onSubmit: submit, noValidate: true },
      h('label', { className: 'eyebrow', htmlFor: 'artifact-url' }, 'submit your artifact'),
      h('div', { className: 'field' }, h('span', { className: 'prompt', 'aria-hidden': true }, '>'),
        h('input', { id: 'artifact-url', value: url, onChange: e => { setUrl(e.target.value); setErr(''); }, placeholder: 'github.com/you/' + node.slug, autoComplete: 'off', spellCheck: false })),
      err ? h('div', { className: 'err', role: 'alert' }, err) : null,
      h('div', { className: 'actions' },
        h('button', { className: 'btn primary tall', type: 'submit' }, 'Submit for validation'),
        h('button', { className: 'btn tall', type: 'button', onClick: () => start('github.com/you/' + node.slug) }, 'Verify demo')),
      h('p', { className: 'note' }, 'Demo validator: it accepts any well-formed repo link and checks nothing. Nothing leaves this page.'));
  }

  return [
    h('div', { className: 'qp-head', key: 'h' },
      h('div', { className: 'qp-top' },
        h('span', { className: 'code' }, node.id + '  ·  TIER ' + (node.depth + 1) + '/' + (GRAPH.maxDepth + 1)),
        h('span', { className: 'pill', 'data-s': status, 'data-boss': !!node.boss }, status === 'verified' ? Icon('check', 11) : locked ? Icon('lock', 11) : null, label),
        h('button', { className: 'btn icon', onClick: onClose, 'aria-label': 'Close quest panel' }, Icon('close'))),
      h('h2', null, node.title), h('p', null, node.skill)),
    h('div', { className: 'qp-body', key: 'b' },
      h('div', { className: 'quest' },
        h('div', { className: 'eyebrow' }, node.boss ? h('span', { className: 'boss-tag' }, 'boss fight') : 'quest'),
        h('div', { className: locked ? 'redact quest' : 'quest', 'aria-hidden': locked }, h('h3', null, node.quest.name), h('p', null, node.quest.brief))),
      h('div', { className: 'meta' },
        h('div', null, h('span', { className: 'eyebrow' }, 'effort'), h('b', null, '~' + node.hours + ' h')),
        h('div', null, h('span', { className: 'eyebrow' }, 'reward'), h('b', null, fmt(node.xp) + ' XP')),
        h('div', null, h('span', { className: 'eyebrow' }, 'artifact'), h('b', { className: 'art' }, node.quest.artifact))),
      h('div', null, h('div', { className: 'eyebrow' }, 'acceptance criteria'),
        h('ul', { className: locked ? 'accept redact' : 'accept', 'aria-hidden': locked }, node.quest.accept.map((a, i) =>
          h('li', { key: i, 'data-ok': status === 'verified' || (running && tick >= i + 2) }, h('span', { className: 'box' }, Icon('check', 11)), h('span', null, a))))),
      h('div', { className: 'lineage' },
        h('span', { className: 'eyebrow' }, 'requires'), h('div', { className: 'chips' }, node.deps.length ? node.deps.map(chip) : h('span', { className: 'chip' }, 'entry point')),
        h('span', { className: 'eyebrow' }, 'unlocks'), h('div', { className: 'chips' }, node.children.length ? node.children.map(chip) : h('span', { className: 'chip' }, 'the target')))),
    h(React.Fragment, { key: 'f' }, foot),
  ];
}

function QuestPanel(props) {
  const last = useRef(null); if (props.node) last.current = props.node;
  const node = last.current, status = node ? props.statusOf(node.id) : 'locked';
  return h('aside', { className: 'panel glass', 'data-open': props.open, 'data-status': status, 'data-boss': !!(node && node.boss), 'aria-hidden': !props.open, inert: props.open ? undefined : '', 'aria-label': 'Quest detail' },
    node ? h(QuestBody, Object.assign({}, props, { key: node.id, node, status, proof: props.proofs[node.id] })) : null);
}

function App() {
  const [st, dispatch] = useReducer(reducer, INIT);
  const eng = useRef(null), rootRef = useRef(null);
  const phone = useMedia('(max-width: 719px)'), wide = useMedia('(min-width: 1280px)');
  const statusOf = useCallback(id => statusFor(st.verified, id), [st.verified]);
  const open = !!st.selected && st.phase === 'matrix';

  useEffect(() => { eng.current.setVerified(st.verified, phone ? 420 : 0); }, [st.verified]);
  useEffect(() => { eng.current.setHover(st.hover); }, [st.hover]);
  useEffect(() => {
    const H = rootRef.current.clientHeight;
    eng.current.setView(st.selected, phone ? { l: 0, r: 0, t: 62, b: open ? H * 0.74 : 62 } : { l: wide ? 252 : 0, r: open ? 444 : 0, t: 62, b: 62 }, phone && open);
  }, [st.selected, open, phone, wide]);
  useEffect(() => { if (st.phase === 'matrix') eng.current.start(); else if (st.phase === 'input') eng.current.stop(); }, [st.phase]);
  useEffect(() => { const f = e => { if (e.key === 'Escape') dispatch({ type: 'SELECT', id: null }); }; window.addEventListener('keydown', f); return () => window.removeEventListener('keydown', f); }, []);

  const onVerify = (id, url) => dispatch({ type: 'VERIFY', id, close: phone, proof: { url, hash: fakeHash(id + url), at: new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC' } });
  const onSelect = useCallback(id => dispatch({ type: 'SELECT', id }), []);
  const onHover = useCallback(id => dispatch({ type: 'HOVER', id }), []);
  const focus = st.hover || st.selected;

  return h('div', { ref: rootRef, 'data-phase': st.phase, style: { position: 'absolute', inset: 0, overflow: 'clip' } },
    h(MatrixCanvas, { engineRef: eng, onHover, onSelect }),
    h(TopBar, { target: st.target, verified: st.verified, statusOf, onReset: () => dispatch({ type: 'RESET' }), onNewTarget: () => dispatch({ type: 'NEW_TARGET' }) }),
    h(NodeIndex, { statusOf, focus, selected: st.selected, onHover, onSelect }),
    h(StatusBar, { focus, engineRef: eng }),
    h(QuestPanel, { node: st.selected ? GRAPH.byId[st.selected] : null, open, proofs: st.proofs, statusOf, onClose: () => onSelect(null), onVerify, onJump: onSelect }),
    h(Terminal, { phase: st.phase, target: st.target, onCompile: t => dispatch({ type: 'COMPILE', target: t }), onReady: () => dispatch({ type: 'READY' }) }));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
