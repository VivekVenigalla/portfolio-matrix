<style>
html { background: #0C0D10; }
body { margin: 0; }
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.offline { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #9097A6; font: 15px/1.5 system-ui, sans-serif; }
/* Layout: one-screen app. A flush top bar, a full-bleed canvas holding the graph, and
   three inset cards over it: the plan rail (left), the quest panel (right), zoom controls. */
:root {
  color-scheme: dark;
  --bg: #0C0D10;
  --surface: #14161B;
  --raised: #1A1D24;
  --line: #23262F;
  --line-2: #30343F;
  --ink: #ECEEF2;
  --muted: #9097A6;
  --faint: #666D7D;
  --accent: #6C8CFF;
  --accent-soft: rgba(108, 140, 255, .12);
  --on-accent: #0B1030;
  --green: #3DD68C;
  --green-soft: rgba(61, 214, 140, .12);
  --gold: #F2B84B;
  --gold-soft: rgba(242, 184, 75, .12);
  --red: #FF8A8A;
  --sans: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .85, .2, 1);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { position: relative; height: 100%; overflow: hidden; overflow: clip; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.mono { font-family: var(--mono); }
.label { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 48px rgba(0, 0, 0, .45); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: #474C5A; background: #20242C; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: #86A1FF; border-color: #86A1FF; }

.btn.ghost:hover { color: var(--ink); background: var(--raised); }
.btn.icon { width: 32px; padding: 0; }
.btn.tall { height: 40px; padding: 0 16px; font-size: 14px; }
.btn.danger:hover { color: var(--red); border-color: rgba(255, 138, 138, .45); }
.btn:focus-visible, .row:focus-visible, .chip:focus-visible, .track:focus-visible, .tick:focus-visible, .targetbtn:focus-visible, select:focus-visible, textarea:focus-visible, .pill:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.field { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .prompt { font-family: var(--mono); color: var(--accent); }
.field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-family: var(--mono); font-size: 13px; }
.field input::placeholder { color: var(--faint); }
.err { font-size: 13px; color: var(--red); }
.note { font-size: 12.5px; color: var(--faint); }
select { height: 30px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--raised); padding: 0 6px; font-size: 13px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised); color: var(--muted); }
button.chip { cursor: pointer; transition: color .15s, border-color .15s; }
button.chip:hover { color: var(--ink); border-color: var(--line-2); }
.st { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; flex: none; }
.st[data-s="active"] { border-color: var(--accent); }
.st[data-s="active"]::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.st[data-s="verified"] { border-color: var(--green); background: var(--green); color: #06140D; }
.st[data-s="verified"][data-boss="true"] { border-color: var(--gold); background: var(--gold); color: #1B1203; }

/* ---------- chrome (hidden until a matrix is on screen) ---------- */
.hud { transition: opacity .5s var(--ease), transform .5s var(--ease); }
[data-phase="input"] .hud, [data-phase="generating"] .hud { opacity: 0; pointer-events: none; }
.topbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 var(--gr) 0 var(--gl); background: rgba(12, 13, 16, .88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); z-index: 3; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { color: var(--accent); flex: none; }
.targetbtn { display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; max-width: 440px; transition: border-color .15s; }
button.targetbtn:hover { border-color: var(--line-2); }
.targetbtn .trk { font-size: 12.5px; color: var(--accent); font-weight: 500; flex: none; }
.targetbtn .txt { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog b { color: var(--ink); font-weight: 500; }
.bar { width: 96px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; transition: width .6s var(--ease); }
.bar.gold i { background: var(--gold); }

.rail { position: absolute; top: 64px; left: var(--gl); bottom: 12px; width: 272px; z-index: 4; display: flex; flex-direction: column; overflow: hidden; transition: transform .4s var(--ease), opacity .25s, visibility 0s; }
.rail[data-open="false"] { transform: translateX(calc(-100% - 40px)); opacity: 0; visibility: hidden; transition: transform .4s var(--ease), opacity .25s, visibility 0s .4s; }
[data-phase="input"] .rail, [data-phase="generating"] .rail { opacity: 0; pointer-events: none; }
.rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 18px; }
.rail-scroll > * { flex: none; }
.next { border: 1px solid rgba(108, 140, 255, .32); background: var(--accent-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.next h3 { font-size: 15px; font-weight: 600; line-height: 1.3; }
.next .why { color: var(--accent); font-size: 12px; font-weight: 500; }
.next.done { border-color: rgba(242, 184, 75, .35); background: var(--gold-soft); }
.sect { display: flex; flex-direction: column; gap: 8px; }
.sect-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
.big { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.big small { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.pace { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.rows { display: flex; flex-direction: column; gap: 1px; margin: 0 -6px; }
.row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border: 0; border-radius: 7px; background: transparent; text-align: left; cursor: pointer; font-size: 13px; transition: background .12s, opacity .15s; }
.row:hover, .row[data-hot="true"] { background: var(--raised); }
.row[data-sel="true"] { background: var(--accent-soft); }
.row[data-dim="true"] { opacity: .4; }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .hrs { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.row[data-s="locked"] .name { color: var(--muted); }
.rail-foot { border-top: 1px solid var(--line); padding: 8px 10px 8px 14px; min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

.controls { position: absolute; right: var(--gr); bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); transition: right .45s var(--ease), opacity .5s; }
.controls .btn { border-color: transparent; background: transparent; color: var(--muted); }
.controls .btn:hover { background: var(--raised); color: var(--ink); }
.legend { display: flex; gap: 12px; padding: 0 12px 0 8px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); margin-right: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.pill { position: absolute; left: var(--gl); bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; max-width: calc(100% - var(--gl) - var(--gr) - 130px); border-radius: 10px; background: var(--surface); border: 1px solid rgba(108, 140, 255, .32); cursor: pointer; font-size: 13px; }
.pill .k { color: var(--accent); font-weight: 500; flex: none; }
.pill .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pill svg { flex: none; color: var(--muted); }
.readout { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 2; max-width: 46%; padding: 6px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.readout b { color: var(--ink); font-weight: 500; }
.readout .down { color: var(--accent); }
.toast { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 9; padding: 9px 14px; border-radius: 9px; background: var(--ink); color: #101216; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: rise .25s var(--ease) both; white-space: nowrap; }
@keyframes rise { from { opacity: 0; translate: 0 6px; } }

/* ---------- target screen (state 0 and 1) ---------- */
.termwrap { position: absolute; inset: 0; display: flex; padding: 16px var(--gr) 16px var(--gl); z-index: 6; overflow-y: auto; transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s; }
[data-phase="matrix"] .termwrap { opacity: 0; transform: scale(.97); pointer-events: none; visibility: hidden; transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s .45s; }
.term { margin: auto; width: min(640px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 20px; }
.term h1 { font-weight: 600; font-size: clamp(24px, 4.4vw, 30px); line-height: 1.15; letter-spacing: -.02em; text-wrap: balance; }
.term .lede { color: var(--muted); font-size: 15px; max-width: 54ch; }
.term .field { height: 50px; }
.term .field input { font-size: 14px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.track { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); text-align: left; cursor: pointer; transition: border-color .15s, background .15s; min-width: 0; }
.track:hover { border-color: var(--line-2); }
.track[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.track .tn { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.track .tn em { font-style: normal; color: var(--accent); }
.track .tc { font-size: 14px; font-weight: 500; line-height: 1.3; }
.track .tm { font-size: 12px; color: var(--faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
.track .tm.has { color: var(--green); }
.term-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.term-foot .note { flex: 1 1 200px; }
.term-foot .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.log { font-family: var(--mono); font-size: 12.5px; display: flex; flex-direction: column; gap: 10px; min-height: 132px; }
.log div { display: grid; grid-template-columns: 16px 64px 1fr; gap: 8px; animation: rise .25s var(--ease) both; }
.log .ok { color: var(--green); } .log .k { color: var(--faint); } .log .v { overflow-wrap: anywhere; min-width: 0; }
.log .run { color: var(--accent); animation: blink .7s steps(2) infinite; }
.log .warn { color: var(--gold); }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- quest panel (states 2 and 3) ---------- */
.panel { position: absolute; top: 64px; bottom: 12px; right: var(--gr); width: min(420px, calc(100% - var(--gl) - var(--gr))); z-index: 5; display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 40px)); opacity: 0; visibility: hidden; transition: transform .45s var(--ease), opacity .3s, visibility 0s .45s; }
.panel[data-open="true"] { transform: none; opacity: 1; visibility: visible; transition: transform .45s var(--ease), opacity .3s, visibility 0s; }
.qp-head { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.qp-top { display: flex; align-items: center; gap: 10px; }
.qp-top .code { font-family: var(--mono); font-size: 12px; color: var(--faint); flex: 1; }
.badge { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px; background: var(--raised); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.badge[data-s="active"] { background: var(--accent-soft); color: var(--accent); }
.badge[data-s="verified"] { background: var(--green-soft); color: var(--green); }
.badge[data-s="verified"][data-boss="true"], .badge.gold { background: var(--gold-soft); color: var(--gold); }
.qp-head h2 { font-weight: 600; font-size: 20px; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.qp-head p { color: var(--muted); }
.qp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.qp-body > * { flex: none; }
.quest { display: flex; flex-direction: column; gap: 8px; }
.quest h3 { font-weight: 600; font-size: 16px; line-height: 1.3; text-wrap: balance; }
.quest p { color: #C3C8D2; max-width: 60ch; }
.boss-tag { color: var(--gold); }
.meta { display: flex; gap: 24px; flex-wrap: wrap; }
.meta div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meta b { font-weight: 500; font-size: 13.5px; }
.accept { display: flex; flex-direction: column; gap: 2px; margin: 6px -6px 0; }
.tick { display: grid; grid-template-columns: 18px 1fr; gap: 10px; width: 100%; padding: 6px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 13.5px; color: #C3C8D2; cursor: pointer; }
.tick:hover { background: var(--raised); }
.tick[aria-disabled="true"] { cursor: default; }
.tick[aria-disabled="true"]:hover { background: transparent; }
.box { width: 16px; height: 16px; margin-top: 2px; border: 1.5px solid var(--line-2); border-radius: 4px; display: grid; place-items: center; color: transparent; transition: all .15s; }
.tick[aria-checked="true"] .box { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.tick[data-done="true"] .box { border-color: var(--green); background: var(--green); color: #06140D; }
.lineage { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
.redact { filter: blur(6px); opacity: .5; user-select: none; pointer-events: none; }
.qp-foot { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; background: #111317; }
.qp-foot .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn.primary { flex: 1; }
.vlog { font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 7px; }
.vlog div { display: grid; grid-template-columns: 16px 52px 1fr; gap: 8px; animation: rise .2s var(--ease) both; }
.vlog .k { color: var(--faint); } .vlog .v { overflow-wrap: anywhere; min-width: 0; }
.vlog .ok { color: var(--green); } .vlog .run { color: var(--accent); animation: blink .7s steps(2) infinite; } .vlog .warn { color: var(--gold); }
.proof { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
.proof dt { color: var(--faint); } .proof dd { overflow-wrap: anywhere; min-width: 0; }
.proof dd.mono { font-size: 12.5px; }
.lockmsg { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); }
.lockmsg svg { flex: none; margin-top: 3px; }

/* ---------- share dialog ---------- */
.scrim { position: absolute; inset: 0; z-index: 8; background: rgba(5, 6, 8, .68); display: flex; padding: 16px var(--gr) 16px var(--gl); overflow-y: auto; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.dialog { margin: auto; width: min(520px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.dialog h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.dialog .dh { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dialog .grp { display: flex; flex-direction: column; gap: 6px; }
.dialog .line { display: flex; gap: 8px; }
.dialog .line .field { flex: 1; min-width: 0; height: 36px; }
.dialog .line .field input { font-size: 12px; }
.dialog .plain input { font-family: var(--sans); font-size: 14px; }
textarea { width: 100%; resize: vertical; min-height: 120px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg); font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--muted); }

@media (min-width: 1180px) { .planbtn, .pill { display: none; } }
@media (min-width: 720px) { [data-panel="true"] .controls { right: calc(var(--gr) + 432px); } }
@media (max-width: 899px) { .readout { display: none; } .legend { display: none; } }
@media (max-width: 719px) {

  .topbar { gap: 8px; }
  .btn.haslabel { width: 32px; padding: 0; }
  .rail { width: auto; right: var(--gr); }
  .panel { top: auto; left: var(--gl); right: var(--gr); bottom: 0; width: auto; height: 72%; border-bottom-left-radius: 0; border-bottom-right-radius: 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .term { padding: 20px 16px; }
  .pill { max-width: calc(100% - var(--gl) - var(--gr) - 124px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
}
</style>
</head>

const TRACK_KEYS = Object.keys(TRACKS);

function buildGraph(key) {
  const T = TRACKS[key], byId = {};
  T.nodes.forEach(n => { byId[n.id] = Object.assign({ children: [], anc: new Set(), desc: new Set() }, n); });
  const nodes = T.nodes.map(n => byId[n.id]), edges = [];
  nodes.forEach(n => n.deps.forEach(p => { byId[p].children.push(n.id); edges.push([p, n.id]); }));
  // Nodes are listed in topological order, so one forward pass gives depth and ancestors.
  nodes.forEach(n => {
    n.depth = n.deps.length ? Math.max.apply(null, n.deps.map(p => byId[p].depth)) + 1 : 0;
    n.deps.forEach(p => { n.anc.add(p); byId[p].anc.forEach(a => n.anc.add(a)); });
  });
  nodes.forEach(n => n.anc.forEach(a => byId[a].desc.add(n.id)));
  const lanes = nodes.map(n => n.lane);
  return { key, name: T.name, capstone: T.capstone, nodes, edges, byId,
    maxDepth: Math.max.apply(null, nodes.map(n => n.depth)),
    laneMin: Math.min.apply(null, lanes), laneMax: Math.max.apply(null, lanes),
    totalHours: nodes.reduce((s, n) => s + n.hours, 0) };
}
const GRAPHS = {}; TRACK_KEYS.forEach(k => { GRAPHS[k] = buildGraph(k); });

function matchTrack(text) {
  let best = null, bestScore = 0, why = '';
  TRACK_KEYS.forEach(k => {
    let score = 0, first = '';
    TRACKS[k].keywords.forEach(kw => { const m = new RegExp('(^|[^a-z0-9+#])(' + kw + ')([^a-z0-9+#]|$)', 'i').exec(text); if (m) { score++; if (!first) first = m[2]; } });
    if (score > bestScore) { best = k; bestScore = score; why = first; }
  });
  return best ? { key: best, why } : null;
}
const statusFor = (G, verified, id) => verified.indexOf(id) >= 0 ? 'verified' : G.byId[id].deps.every(p => verified.indexOf(p) >= 0) ? 'active' : 'locked';

/* What to do next: prefer a quest already started, otherwise the open quest
   with the most remaining hours behind it (the critical path). */
function planFor(G, verified, checks) {
  const isV = id => verified.indexOf(id) >= 0, tail = {};
  for (let i = G.nodes.length - 1; i >= 0; i--) { const n = G.nodes[i]; tail[n.id] = (isV(n.id) ? 0 : n.hours) + Math.max.apply(null, [0].concat(n.children.map(c => tail[c]))); }
  const frac = n => { const c = checks[n.id]; return c ? c.filter(Boolean).length / n.quest.accept.length : 0; };
  const open = G.nodes.filter(n => !isV(n.id) && n.deps.every(isV));
  const started = open.filter(n => frac(n) > 0).sort((a, b) => frac(b) - frac(a));
  let next = null, reason = '';
  if (started.length) { next = started[0]; reason = 'In progress'; }
  else if (open.length) { next = open.slice().sort((a, b) => tail[b.id] - tail[a.id])[0]; reason = open.length > 1 ? 'On the critical path' : ''; }
  return { next, reason, hoursLeft: G.nodes.reduce((s, n) => s + (isV(n.id) ? 0 : n.hours), 0) };
}
